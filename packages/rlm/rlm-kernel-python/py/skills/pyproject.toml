# Kernel-side distribution bundling the six RLM skill packages. Each skill is
# a thin typed wrapper over the generic host bridge (`rlm.host_request`); the
# `rlm` runtime travels with `@deepseek-ai/dsh-rlm-kernel-python` and is always
# importable inside its kernels, so it is intentionally not declared as a
# dependency (it is not published on PyPI).
[project]
name = "dsh-rlm-skills"
version = "0.1.0"
description = "dsh RLM kernel skills: goal, compact, refine, rlm_heartbeat, agent_message, agent_observe over the host bridge"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "goal",
    "compact",
    "refine",
    "rlm_heartbeat",
    "agent_message",
    "agent_observe",
]
